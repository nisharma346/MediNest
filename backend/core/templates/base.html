<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MediNest{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        html {
            overflow-x: hidden;
        }
        body {
            overflow-x: clip;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .table-responsive {
            -webkit-overflow-scrolling: touch;
        }
        .medinest-logo-footer {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 23px;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        .medinest-logo-footer i {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #0750a0, #00a49b);
            color: white;
            font-size: 19px;
        }
        @media (max-width: 576px) {
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    {% include 'includes/navbar.html' %}

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}


    <!-- Footer -->
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">

            <div class="mb-2">
                <a class="medinest-logo-footer" href="{% url 'core:home' %}">
                    <i class="fa-solid fa-heart-pulse"></i>
                    MediNest
                </a>
            </div>

            <p class="mb-1 text-white-50">
                Your trusted healthcare & wellness platform.
            </p>

            <small class="text-white-50">
                © 2026 MediNest. All rights reserved.
            </small>

        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
