{% extends "base.html" %}

{% block content %}

<style>
    .auth-page {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        padding: 60px 15px;
    }

    .auth-card {
        width: 100%;
        max-width: 480px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .auth-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #e8f5ef;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #168a5b;
        font-size: 28px;
    }

    .auth-title {
        color: #123b5d;
        font-weight: 700;
        text-align: center;
    }

    .auth-subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 25px;
    }

    .form-label {
        font-weight: 600;
        color: #34495e;
    }

    .form-control {
        padding: 12px;
        border-radius: 10px;
    }

    .register-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #123b5d;
        color: white;
        font-weight: 600;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: #0d2d47;
    }

    .auth-link {
        color: #168a5b;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2 class="auth-title">Create Your Account</h2>

        <p class="auth-subtitle">
            Join MediNest and manage your healthcare journey.
        </p>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password"
                    required>
            </div>

            <button type="submit" class="register-btn">
                <i class="fa-solid fa-user-plus me-2"></i>
                Create Account
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="auth-link">
                Login
            </a>
        </p>

    </div>

</section>

{% endblock %}
